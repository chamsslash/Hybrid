{{- if .Values.liquibaseDiff.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authservice-liquibase-diff
spec:
  schedule: {{ .Values.liquibaseDiff.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: liquibase-diff
              image: "{{ .Values.liquibaseDiff.image }}"
              command:
                - liquibase
                - --url=jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)
                - --username=$(DB_USER)
                - --password=$(DB_PASSWORD)
                - --referenceUrl=offline:postgresql
                - --changeLogFile={{ .Values.liquibaseDiff.changeLogFile | quote }}
                - diffChangelog
              env:
                - name: DB_HOST
                  value: "{{ .Values.env.dbHost }}"
                - name: DB_PORT
                  value: "{{ .Values.env.dbPort }}"
                - name: DB_NAME
                  value: "{{ .Values.env.dbName }}"
                - name: DB_USER
                  value: "{{ .Values.env.dbUser }}"
                - name: DB_PASSWORD
                  value: "{{ .Values.env.dbPassword }}"
{{- end }}
