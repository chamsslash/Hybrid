apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  labels:
    app: authservice
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
      annotations:
        # См. пояснение в чарте httpservice. Порт — management-порт контейнера,
        # в Service он намеренно не публикуется (beads c2k).
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8090"
    spec:
{{- if .Values.schemaWait.enabled }}
      # Схему создаёт Job messegerparody-liquibase (hook post-install,pre-upgrade),
      # а Hibernate в этом сервисе работает с ddl-auto: validate и ничего не создаёт.
      # На СВЕЖЕЙ установке отрабатывает ветка post-install, то есть Job стартует
      # ПОСЛЕ основных ресурсов, и под приложения успевает подняться раньше схемы —
      # validate не находит таблиц и уводит под в CrashLoopBackOff до отработки Job.
      # Поэтому ждём схему здесь: порядок становится детерминированным на обоих
      # путях (install и upgrade), а не зависит от рестарт-backoff.
      # Ждём именно таблицу, а не pg_isready: последний отвечает лишь «сервер
      # принимает соединения», схемы при этом может ещё не быть.
      # Опорная таблица — baseline v1 (001-create-users.yaml).
      # См. Hybrid-kubernetes-non-local-2cm.
      initContainers:
        - name: wait-for-schema
          image: "{{ .Values.schemaWait.image | default "postgres:15" }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # psql молча падает и когда сервер ещё не поднят, и когда таблицы нет,
              # поэтому один цикл покрывает оба состояния. to_regclass возвращает
              # NULL для отсутствующей таблицы и не бросает ошибку.
              until psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" \
                    -tAc "SELECT to_regclass('public.${WAIT_TABLE}') IS NOT NULL" 2>/dev/null \
                    | grep -qx t; do
                echo "Waiting for schema: table ${WAIT_TABLE} in ${DB_HOST}:${DB_PORT}/${DB_NAME}..."
                sleep "${WAIT_INTERVAL}"
              done
              echo "Schema is ready: table ${WAIT_TABLE} exists."
          env:
            - name: DB_HOST
              value: "{{ .Values.env.dbHost }}"
            - name: DB_PORT
              value: "{{ .Values.env.dbPort }}"
            - name: DB_NAME
              value: "{{ .Values.env.dbName }}"
            - name: DB_USER
              value: "{{ .Values.env.dbUser }}"
            - name: WAIT_TABLE
              value: "{{ .Values.schemaWait.table | default "users" }}"
            - name: WAIT_INTERVAL
              value: "{{ .Values.schemaWait.intervalSeconds | default 2 }}"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: DB_PASSWORD
{{- end }}
      containers:
        - name: authservice
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" | quote }}
          ports:
            - containerPort: 8081
            # Management-порт (beads c2k). В Service его НЕ добавляем: Prometheus
            # скрейпит по pod IP через kubernetes_sd_configs role: pod, а не через
            # Service, поэтому светить порт наружу незачем.
            - containerPort: 8090
          # Первая проба у этого сервиса. Раньше её не было вовсе: единственным
          # эндпоинтом был gRPC на 9092, а /actuator/health отсутствовал вместе
          # с актуатором.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Values.env.kafkaBootstrap }}"
            - name: SPRING_DATASOURCE_URL
              value: "{{ .Values.env.datasourceUrl }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.env.datasourceUsername }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: DB_PASSWORD
            - name: DB_HOST
              value: "{{ .Values.env.dbHost }}"
            - name: DB_PORT
              value: "{{ .Values.env.dbPort }}"
            - name: DB_NAME
              value: "{{ .Values.env.dbName }}"
            - name: DB_USER
              value: "{{ .Values.env.dbUser }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: DB_PASSWORD
            - name: SPRING_REDIS_HOST
              value: "{{ .Values.env.redisHost }}"
            - name: SPRING_REDIS_PORT
              value: "{{ .Values.env.redisPort }}"
            - name: GOOGLE_CLIENT_ID
              value: "{{ .Values.google.clientId }}"
            - name: INGRESS_HOST
              value: "{{ .Values.global.ingressHost | default "myapp.localtest.me" }}"
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: GOOGLE_CLIENT_SECRET
            - name: JWT_PUBLIC_KEY_PEM
              value: |-
{{ .Values.env.jwtPublicKey | nindent 16 }}
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "{{ .Values.env.kafkaConsumerGroup }}"
            - name: MINIO_ENDPOINT
              value: "{{ .Values.env.minioEndpoint }}"
            - name: MINIO_BUCKET
              value: "{{ .Values.env.minioBucket }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: MINIO_SECRET_KEY

            # ── Трейсинг (beads izv) ──────────────────────────────────
            # Значения приходят из global, потому что подчарт видит только то, что
            # лежит буквально под `global` в values.yaml зонтичного чарта.
            - name: TRACING_ENABLED
              value: "{{ .Values.global.tracing.enabled }}"
            - name: TRACING_SAMPLING
              value: "{{ .Values.global.tracing.samplingProbability }}"
            - name: TRACING_ZIPKIN_ENDPOINT
              value: "{{ .Values.global.tracing.zipkinEndpoint }}"