apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  labels:
    app: authservice
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      containers:
        - name: authservice
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" | quote }}
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Values.env.kafkaBootstrap }}"
            - name: SPRING_DATASOURCE_URL
              value: "{{ .Values.env.datasourceUrl }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.env.datasourceUsername }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: DB_PASSWORD
            - name: DB_HOST
              value: "{{ .Values.env.dbHost }}"
            - name: DB_PORT
              value: "{{ .Values.env.dbPort }}"
            - name: DB_NAME
              value: "{{ .Values.env.dbName }}"
            - name: DB_USER
              value: "{{ .Values.env.dbUser }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: DB_PASSWORD
            - name: SPRING_REDIS_HOST
              value: "{{ .Values.env.redisHost }}"
            - name: SPRING_REDIS_PORT
              value: "{{ .Values.env.redisPort }}"
            - name: GOOGLE_CLIENT_ID
              value: "{{ .Values.google.clientId }}"
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: GOOGLE_CLIENT_SECRET
            - name: JWT_PUBLIC_KEY_PEM
              value: |-
{{ .Values.env.jwtPublicKey | nindent 16 }}
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "{{ .Values.env.kafkaConsumerGroup }}"
            - name: MINIO_ENDPOINT
              value: "{{ .Values.env.minioEndpoint }}"
            - name: MINIO_BUCKET
              value: "{{ .Values.env.minioBucket }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
                  key: MINIO_SECRET_KEY
