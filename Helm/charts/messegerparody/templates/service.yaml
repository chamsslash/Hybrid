apiVersion: v1
kind: Service
metadata:
  name: messegerparody
  labels:
    app: messegerparody
spec:
  type: ClusterIP
  selector:
    app: messegerparody
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: grpc
      port: 9091
      targetPort: 9091
      protocol: TCP
