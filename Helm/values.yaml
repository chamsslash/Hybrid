# Global toggles
infra:
  kafka: true
  postgres: true
  redis: true
  prometheus: true
  grafana: true
  ingress: true

# Local ingress domain
ingress:
  host: myapp.local

# Kafka (KRaft)
kafka:
  image: bitnami/kafka:latest
  replicas: 1

postgres:
  image: postgres:15
  database: hybrid_db
  username: postgres
  password: postgres123

redis:
  image: redis:7

prometheus:
  image: prom/prometheus:latest

grafana:
  image: grafana/grafana:latest
  adminPassword: admin123

# Service images
authservice:
  enabled: true
  image:
    repository: your-registry/authservice
    tag: latest
  google:
    clientId: CHANGE_ME
    clientSecret: CHANGE_ME
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"
    dbHost: postgres
    dbPort: "5432"
    dbName: hybrid_db
    dbUser: postgres
    dbPassword: postgres123
  liquibaseDiff:
    enabled: true
    image: liquibase/liquibase:4.27.0
    schedule: "*/10 * * * *"

httpservice:
  enabled: true
  image:
    repository: your-registry/httpservice
    tag: latest
  security:
    refreshSecret: CHANGE_ME
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"

jwtproxy:
  enabled: true
  image:
    repository: your-registry/jwtproxy
    tag: latest
  env:
    kafkaBootstrap: kafka:9092

messegerparody:
  enabled: true
  image:
    repository: your-registry/messegerparody
    tag: latest
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"
    dbHost: postgres
    dbPort: "5432"
    dbName: hybrid_db
    dbUser: postgres
    dbPassword: postgres123
  liquibaseDiff:
    enabled: true
    image: liquibase/liquibase:4.27.0
    schedule: "*/10 * * * *"
