httpservice:
  enabled: true
  replicaCount: 1
  image:
    repository: httpservice
    tag: latest
    pullPolicy: IfNotPresent
  # refreshSecret comes from the app Secret (secrets.refreshSecret -> REFRESH_SECRET)
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    # datasourcePassword comes from the app Secret (secrets.dbPassword)
    redisHost: redis
    redisPort: "6379"
    # MinIO endpoint/bucket are plain config; access/secret keys come from the app Secret.
    minioEndpoint: http://minio:9000  # -> MINIO_ENDPOINT
    minioBucket: images               # -> MINIO_BUCKET
    # refreshSecret / jwtPrivateKey / geminiApiKey come from the app Secret.
    # Public keys below are not secret and stay as plain config.
    jwtPublicKey: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkxWruRf9t3Bdp/7gqc7t
