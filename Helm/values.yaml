messegerparody:
  enabled: true
  replicaCount: 1
  image:
    repository: messegerparody
    tag: latest
    pullPolicy: IfNotPresent
  liquibaseJob:
    enabled: true
    backoffLimit: 1
    waitImage: postgres:15

  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    # datasourcePassword / dbPassword come from the app Secret (secrets.dbPassword)
    redisHost: redis
    redisPort: "6379"
    dbHost: postgres
    dbPort: "5432"
    dbName: hybrid_db
    dbUser: postgres
    kafkaConsumerGroup: messegerparody-consumer
