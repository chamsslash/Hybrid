# Global toggles
infra:
  kafka: true
  postgres: true
  redis: true
  prometheus: true
  grafana: true
  ingress: true

# Local ingress domain
ingress:
  host: myapp.local

# Kafka (KRaft)
kafka:
  image: moeenz/docker-kafka-kraft
  replicas: 1
  brokerId: 1
  hostName: kafka
  createTopics: topic-a,topic-b,topic-c
  partitionsPerTopic: 3
  autoCreateTopics: true

postgres:
  image: postgres:15
  database: hybrid_db
  username: postgres
  password: postgres123

redis:
  image: redis:7

prometheus:
  image: prom/prometheus:latest

grafana:
  image: grafana/grafana:latest
  adminPassword: admin123

# Service images
authservice:
  enabled: true
  replicaCount: 1
  image:
    repository: authservice
    tag: latest
    pullPolicy: IfNotPresent
  google:
    clientId: local-google-client-id
    clientSecret: local-google-client-secret
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"
    dbHost: postgres
    dbPort: "5432"
    dbName: hybrid_db
    dbUser: postgres
    dbPassword: postgres123
    kafkaConsumerGroup: messegerparody-consumer


httpservice:
  enabled: true
  replicaCount: 1
  image:
    repository: httpservice
    tag: latest
    pullPolicy: IfNotPresent
  security:
    refreshSecret: local-refresh-secret
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"
    refreshSecret: local-refresh-secret
    jwtPublicKey: "-----BEGIN PUBLIC KEY-----\\nREPLACE_ME\\n-----END PUBLIC KEY-----"
    jwtPrivateKey: "-----BEGIN PRIVATE KEY-----\\nREPLACE_ME\\n-----END PRIVATE KEY-----"
    yandexPublicKey: "-----BEGIN PUBLIC KEY-----\\nREPLACE_ME\\n-----END PUBLIC KEY-----"
    yandexPrivateKey: "-----BEGIN PRIVATE KEY-----\\nREPLACE_ME\\n-----END PRIVATE KEY-----"
    yandexServiceAccountId: replace-service-account-id
    yandexKeyId: replace-key-id

jwtproxy:
  enabled: true
  replicaCount: 1
  image:
    repository: jwtproxy
    tag: latest
    pullPolicy: IfNotPresent
  env:
    kafkaBootstrap: kafka:9092

messegerparody:
  enabled: true
  replicaCount: 1
  image:
    repository: messegerparody
    tag: latest
    pullPolicy: IfNotPresent

  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"
    dbHost: postgres
    dbPort: "5432"
    dbName: hybrid_db
    dbUser: postgres
    dbPassword: postgres123
