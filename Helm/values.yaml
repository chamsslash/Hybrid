# Global toggles
infra:
  kafka: true
  postgres: true
  redis: true
  prometheus: true
  grafana: true
  ingress: true

# Local ingress domain
ingress:
  host: myapp.local

# Kafka (KRaft)
kafka:
  image: bitnami/kafka:latest
  replicas: 1

postgres:
  image: postgres:15
  database: hybrid_db
  username: postgres
  password: postgres123

redis:
  image: redis:7

prometheus:
  image: prom/prometheus:latest

grafana:
  image: grafana/grafana:latest
  adminPassword: admin123

# Service images
authservice:
  enabled: true
  image:
    repository: authservice
    tag: latest
    pullPolicy: IfNotPresent
  google:
    clientId: local-google-client-id
    clientSecret: local-google-client-secret
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"
    dbHost: postgres
    dbPort: "5432"
    dbName: hybrid_db
    dbUser: postgres
    dbPassword: postgres123
  liquibaseDiff:
    enabled: true
    image: liquibase/liquibase:4.27.0
    schedule: "*/10 * * * *"
    changeLogFile: /liquibase/changelog/changes/authservice-diff.yaml
    persistence:
      enabled: true
      size: 1Gi

httpservice:
  enabled: true
  image:
    repository: httpservice
    tag: latest
    pullPolicy: IfNotPresent
  security:
    refreshSecret: local-refresh-secret
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"

jwtproxy:
  enabled: true
  image:
    repository: jwtproxy
    tag: latest
    pullPolicy: IfNotPresent
  env:
    kafkaBootstrap: kafka:9092

messegerparody:
  enabled: true
  image:
    repository: messegerparody
    tag: latest
    pullPolicy: IfNotPresent
  env:
    kafkaBootstrap: kafka:9092
    datasourceUrl: jdbc:postgresql://postgres:5432/hybrid_db
    datasourceUsername: postgres
    datasourcePassword: postgres123
    redisHost: redis
    redisPort: "6379"
    dbHost: postgres
    dbPort: "5432"
    dbName: hybrid_db
    dbUser: postgres
    dbPassword: postgres123
  liquibaseDiff:
    enabled: true
    image: liquibase/liquibase:4.27.0
    schedule: "*/10 * * * *"
    changeLogFile: /liquibase/changelog/changes/messegerparody-diff.yaml
    persistence:
      enabled: true
      size: 1Gi
