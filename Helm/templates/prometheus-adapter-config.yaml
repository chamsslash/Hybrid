apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: hybrid-platform
  labels:
    app: prometheus-adapter
data:
  config.yaml: |
    rules:
      # Отключаем правила по умолчанию
      default: false
      
      # Кастомные правила для HPA
      custom:
        # HTTP RPS метрика
        - seriesQuery: 'http_server_requests_seconds_count{service!=""}'
          resources:
            overrides:
              namespace: { resource: "namespace" }
              pod: { resource: "pod" }
          name:
            matches: '^http_server_requests_seconds_count'
            as: 'http_rps'
          metricsQuery: 'sum(rate(http_server_requests_seconds_count[2m])) by (service)'
        
        # gRPC RPS метрика
        - seriesQuery: 'grpc_server_requests_seconds_count{service!=""}'
          resources:
            overrides:
              namespace: { resource: "namespace" }
              pod: { resource: "pod" }
          name:
            matches: '^grpc_server_requests_seconds_count'
            as: 'grpc_rps'
          metricsQuery: 'sum(rate(grpc_server_requests_seconds_count[2m])) by (service)'
        
        # Kafka Consumer Lag метрика
        - seriesQuery: 'kafka_consumergroup_group_lag{consumergroup!="",topic!=""}'
          resources:
            overrides:
              namespace: { resource: "namespace" }
              pod: { resource: "pod" }
          name:
            as: 'kafka_group_lag'
          metricsQuery: >
            sum by (consumergroup, topic) (
              max by (consumergroup, topic, partition) (kafka_consumergroup_group_lag)
            ) or on() vector(0)
        
        # JVM Memory Usage
        - seriesQuery: 'jvm_memory_used_bytes{area="heap"}'
          resources:
            overrides:
              namespace: { resource: "namespace" }
              pod: { resource: "pod" }
          name:
            as: 'jvm_heap_usage'
          metricsQuery: 'sum(jvm_memory_used_bytes{area="heap"}) by (pod)'
        
        # JVM GC Duration
        - seriesQuery: 'jvm_gc_collection_seconds_sum'
          resources:
            overrides:
              namespace: { resource: "namespace" }
              pod: { resource: "pod" }
          name:
            as: 'jvm_gc_duration'
          metricsQuery: 'sum(rate(jvm_gc_collection_seconds_sum[2m])) by (pod)'
