{{- if .Values.infra.ingress }}
# SPA-модель (beads 59):
# - Всё, кроме данных, публично: HTML-шеллы, статика, SockJS-хендшейки.
#   WebSocket аутентифицируется на уровне STOMP CONNECT (access-токен),
#   т.к. хендшейк браузера не несёт Authorization-заголовок.
# - Данные (/api/*) и мутации защищены auth_request -> AuthService /jwtcheck
#   по Authorization: Bearer. Без auth-signin: API отдаёт голый 401,
#   SPA сама делает refresh+retry.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-public
  annotations:
    # nginx default (1m) is smaller than the app's supported upload size
    # (10MB — see HTTPService application.yml multipart config). Avatar
    # uploads on /reactive/register were rejected by the ingress before
    # reaching httpservice.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /startauth
            pathType: Prefix
            backend:
              service:
                name: authservice
                port:
                  number: 8081
          - path: /login/oauth2/code/google
            pathType: Prefix
            backend:
              service:
                name: authservice
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: httpservice
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-protected
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://authservice.{{ .Release.Namespace }}.svc.cluster.local:8081/jwtcheck"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-ID, X-Authorities, X-Jti, X-Sid"
    # same limit as http-public — /reactive/createchat accepts a chat image upload
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: httpservice
                port:
                  number: 8080
          - path: /AiAssist
            pathType: Prefix
            backend:
              service:
                name: httpservice
                port:
                  number: 8080
          - path: /reactive/createchat
            pathType: Prefix
            backend:
              service:
                name: httpservice
                port:
                  number: 8080
{{- end }}
