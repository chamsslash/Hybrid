# ConfigMap для общих настроек Spring Boot приложений
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-config
  namespace: {{ .Release.Namespace }}
data:
  application-kubernetes.yml: |
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
          base-path: /actuator
      endpoint:
        health:
          show-details: when-authorized
        metrics:
          enabled: true
        prometheus:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
        tags:
          application: ${spring.application.name}
          environment: kubernetes
        distribution:
          percentiles-histogram:
            http.server.requests: true
            grpc.server.requests: true
          percentiles:
            http.server.requests: 0.5,0.95,0.99
            grpc.server.requests: 0.5,0.95,0.99
    
    logging:
      level:
        root: INFO
        com.example: DEBUG
        org.springframework.kafka: DEBUG
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    
    spring:
      application:
        name: ${APPLICATION_NAME:unknown}
      profiles:
        active: kubernetes
      kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
          group-id: ${spring.application.name}
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.apache.kafka.common.serialization.StringSerializer
      datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hybrid_db}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
        hikari:
          maximum-pool-size: 10
          minimum-idle: 5
          connection-timeout: 30000
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
      redis:
        host: ${SPRING_REDIS_HOST:redis-master}
        port: ${SPRING_REDIS_PORT:6379}
        password: ${SPRING_REDIS_PASSWORD:redis123}
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
            max-wait: -1ms
