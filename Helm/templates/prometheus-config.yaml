{{- if .Values.infra.prometheus }}
# Конфиг вынесен в ОТДЕЛЬНЫЙ файл специально: Deployment в prometheus.yaml несёт
# аннотацию checksum/config, посчитанную от этого файла. Если бы ConfigMap и
# Deployment лежали вместе, шаблон включал бы сам себя через include, и Helm падал
# бы с "nested reference". Разделение файлов — единственный рабочий вариант.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            # Ограничение namespace'ом обязательно и работает В ПАРЕ с Role
            # (не ClusterRole) в prometheus.yaml. Уберёшь эти строки — клиент
            # попробует листать поды всего кластера, namespace-scoped Role
            # этого не разрешит, и вернётся 403 при нуле целей.
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
        # relabel_configs выше решают, КОГО скрейпить; metric_relabel_configs —
        # ЧТО из принесённого сохранить. Список собирается из values.yaml, чтобы
        # ответ на вопрос «какие метрики мы собираем» читался за минуту, а не
        # выковыривался из регулярки в шаблоне.
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: "{{ join "|" .Values.prometheus.keepMetrics }}"
{{- end }}
