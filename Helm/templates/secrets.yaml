{{- /*
Application secrets Secret.

Real secret values MUST NOT be committed to values.yaml. Supply them at deploy
time, e.g.:

  helm upgrade --install hybrid ./Helm \
    --set secrets.dbPassword=... \
    --set secrets.grafanaAdminPassword=... \
    --set secrets.googleClientSecret=... \
    --set secrets.refreshSecret=... \
    --set secrets.minioRootUser=... \
    --set secrets.minioRootPassword=... \
    --set secrets.minioAccessKey=... \
    --set secrets.minioSecretKey=... \
    --set-file secrets.jwtPrivateKeyPem=./jwt-private.pem \
    --set-file secrets.yandexPrivateKeyPem=./yandex-sa.pem

Or set `secrets.create: false` and point every workload at an externally
managed Secret (e.g. External Secrets Operator / Sealed Secrets) via
`global.appSecretName`.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.appSecretName | default (printf "%s-app-secrets" .Release.Name) }}
  labels:
    app.kubernetes.io/part-of: hybrid
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  REFRESH_SECRET: {{ .Values.secrets.refreshSecret | quote }}
  JWT_PRIVATE_KEY_PEM: {{ .Values.secrets.jwtPrivateKeyPem | quote }}
  YANDEX_PRIVATE_KEY_PEM: {{ .Values.secrets.yandexPrivateKeyPem | quote }}
  MINIO_ROOT_USER: {{ required "MinIO creds must be provided (--set/.env): secrets.minioRootUser" .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "MinIO creds must be provided (--set/.env): secrets.minioRootPassword" .Values.secrets.minioRootPassword | quote }}
  MINIO_ACCESS_KEY: {{ required "MinIO creds must be provided (--set/.env): secrets.minioAccessKey" .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "MinIO creds must be provided (--set/.env): secrets.minioSecretKey" .Values.secrets.minioSecretKey | quote }}
{{- end }}
