{{- if .Values.infra.alertmanager }}
# Alertmanager (beads zei).
#
# Тикет заводился как YAGNI и был прав в главном: доставлять алерты на этом стенде
# НЕКУДА. Один пользователь, который смотрит дашборд по запросу; ни почты, ни
# мессенджера, ни дежурства. Поэтому здесь нет ни одного настоящего приёмника, и
# добавлять его «на будущее» было бы ровно тем YAGNI, против которого тикет и писался.
#
# Ценность даёт другая половина: Alertmanager группирует, дедуплицирует и гасит
# срабатывания правил, превращая поток «условие истинно каждые 15 секунд» в список
# активных проблем с историей. Правила при этом живут в Prometheus
# (templates/prometheus-rules.yaml) и полезны сами по себе — они и есть записанный
# ответ на вопрос «что в этой системе считается поломкой».
#
# Как отсюда сделать рабочую доставку: заменить приёмник blackhole на настоящий
# (webhook/email/telegram) и указать его в route.receiver. Больше ничего менять
# не потребуется.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      # group_by по имени алерта и сервису: двадцать одинаковых срабатываний по
      # разным подам одного деплоймента — это одна проблема, а не двадцать.
      group_by: ['alertname', 'app']
      group_wait: 30s
      group_interval: 5m
      # repeat_interval большой намеренно: напоминать некому, а короткий интервал
      # только раздувал бы историю дублями.
      repeat_interval: 12h
      receiver: blackhole
    receivers:
      # Приёмник без конфигурации — Alertmanager принимает алерт, показывает его
      # в своём UI и никуда не отправляет. Это осознанная заглушка, а не недоделка:
      # см. шапку файла.
      - name: blackhole
    inhibit_rules:
      # Упавшая цель порождает лавину: заодно «сработает» и лаг, и нехватка реплик,
      # и ошибки в логах. Пока висит critical по тому же сервису, warning'и по нему
      # гасятся — в списке остаётся причина, а не следствия.
      - source_matchers: ['severity = critical']
        target_matchers: ['severity = warning']
        equal: ['app']
{{- end }}
