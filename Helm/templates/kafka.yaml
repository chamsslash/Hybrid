{{- if .Values.infra.kafka }}
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - containerPort: 9092
          env:
            # Single-node KRaft (broker + controller) — multi-arch apache/kafka
            - name: KAFKA_NODE_ID
              value: "{{ default "1" .Values.kafka.brokerId }}"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ default "kafka" .Values.kafka.hostName }}:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "{{ default "1" .Values.kafka.brokerId }}@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "{{ default "true" .Values.kafka.autoCreateTopics }}"
            # Страховка к джобе kafka-topics (beads lo2). Авто-создание оставлено включённым
            # ради retry/DLT-топиков Spring Kafka, но брокерский дефолт num.partitions=1
            # означал, что любой клиент, дотянувшийся до топика раньше джобы, создавал его
            # однопартиционным — и консьюмер кешировал ровно одну партицию до истечения
            # metadata.max.age.ms (~5 минут). Приравняв дефолт к partitionsPerTopic, мы
            # делаем авто-созданный топик неотличимым по геометрии от созданного джобой.
            - name: KAFKA_NUM_PARTITIONS
              value: "{{ .Values.kafka.partitionsPerTopic }}"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      volumes:
        # emptyDir: данные брокера не переживают рестарт пода kafka — вместе с ними
        # исчезают и топики. Джоба kafka-topics висит на хуках релиза и в этот момент
        # не переигрывается, поэтому геометрию восстанавливает не она, а авто-создание
        # с KAFKA_NUM_PARTITIONS выше — по числу партиций результат тот же. Дыра
        # остаётся одна: если сразу после рестарта kafka перезапустится и messegerparody,
        # его KafkaAdmin (retry-топики Spring объявляют главные топики с 1 партицией)
        # может успеть создать топик раньше первого обращения продюсера. Полноценный PVC
        # под брокера — за рамками beads lo2, лечится отдельным тикетом.
        - name: kafka-data
          emptyDir: {}
{{- end }}
