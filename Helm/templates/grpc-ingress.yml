apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  rules:
    - host: auth.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
    - host: db.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: db-service
                port:
                  number: 80
    - host: handle.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: handle-service
                port:
                  number: 80
