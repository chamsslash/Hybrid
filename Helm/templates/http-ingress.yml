apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/issuer: le-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # CORS — включаем только для API-хоста
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($host = api.sunnytyan.com) {
        add_header Access-Control-Allow-Origin "https://sunnytyan.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
        if ($request_method = OPTIONS) {
          add_header Content-Length 0;
          add_header Content-Type text/plain;
          return 204;
        }
      }
spec:
  tls:
    - hosts:
        - api.sunnytyan.com
        - grafana.sunnytyan.com
        - prometheus.sunnytyan.com
      secretName: tls-secret # cert-manager создаст единый секрет для всех SAN
  rules:
    # -------- API --------
    - host: api.sunnytyan.com
      http:
        paths:
          - path: /welcome
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 2009
          - path: /startauth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /reactive/register
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 2009
          - path: /authcallback
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 80
          - path: /reactive/login
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 2009
          - path: /collect-fingerprint
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 2009
          - path: /exchangeTokens
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 2009

    # -------- Grafana --------
    - host: grafana.sunnytyan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-svc     # если kube-prom stack: kube-prometheus-stack-grafana
                port:
                  number: 3000        # у чарта часто 80 — проверь

    # -------- Prometheus --------
    - host: prometheus.sunnytyan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-svc  # если kube-prom stack: prometheus-k8s
                port:
                  number: 9090
