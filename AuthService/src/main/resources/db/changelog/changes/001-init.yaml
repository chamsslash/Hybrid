databaseChangeLog:
  - changeSet:
      id: auth-001-init-users
      author: liquibase
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: myapppassword
                  type: VARCHAR(255)
              - column:
                  name: image_url
                  type: VARCHAR(255)
              - column:
                  name: user_role
                  type: VARCHAR(255)
              - column:
                  name: google_sub
                  type: VARCHAR(255)
