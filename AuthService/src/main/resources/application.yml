server:
  port: 8081
  reactive:
    session:
      cookie:
        http-only: true
        secure: true
spring:
  data:
    redis:
      url: redis://redis:6379/0
  kafka:
    bootstrap-servers: kafka:9092


  security:
    oauth2:
      client:
        provider:
          google:

            # access_type=offline: говорит Google, что нам нужен refresh_token
            # prompt=consent: заставляет Google снова показать экран согласия, что инициирует выдачу нового refresh_token
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
        registration:
          google:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
            redirect-uri: "http://${INGRESS_HOST:myapp.localtest.me}/login/oauth2/code/google"


  autoconfigure:
    enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:hybrid_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}

  jpa:
    hibernate:
      # Второй писатель схемы на ту же hybrid_db. Liquibase живёт в MessegerParody
      # и остаётся единственным владельцем: сюда его добавлять нельзя, два
      # мигратора на одной БД воспроизвели бы ту же болезнь.
      # См. Hybrid-kubernetes-non-local-fwt.
      ddl-auto: validate
      show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

grpc:
  server:
    port: 9092
