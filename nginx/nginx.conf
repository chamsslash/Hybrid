worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream httpservice {
    server httpservice:8080;
  }

  upstream authservice {
    server authservice:8081;
  }

  # Используем Authorization из запроса или из cookie access (если заголовка нет)
  map $http_authorization $auth_header_from_request {
    default $http_authorization;
    "" "";
  }
  map $cookie_access $auth_header_from_cookie {
    default "Bearer $cookie_access";
    "" "";
  }
  map $auth_header_from_request $auth_header {
    default $auth_header_from_request;
    "" $auth_header_from_cookie;
  }

  server {
    listen 80;

    # Внутренний вызов для проверки JWT
    location = /auth {
      internal;
      proxy_pass http://authservice/jwtcheck;
      proxy_set_header Authorization $auth_header;
    }

    # Публичные маршруты
    location = /startauth { proxy_pass http://authservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /login/oauth2/code/google { proxy_pass http://authservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /authcallback { proxy_pass http://httpservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /reactive/login { proxy_pass http://httpservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /reactive/register { proxy_pass http://httpservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /collect-fingerprint { proxy_pass http://httpservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /exchangeTokens { proxy_pass http://httpservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /welcome { proxy_pass http://httpservice; include /etc/nginx/conf.d/proxy_headers.conf; }
    location = /registerpage { proxy_pass http://httpservice; include /etc/nginx/conf.d/proxy_headers.conf; }

    location @auth_fail {
      return 302 /collect-fingerprint?return_url=$request_uri;
    }

    # Статика
    location ~* \.(js|css|png|jpg|svg|ico)$ {
      proxy_pass http://httpservice;
      include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # Защищённые маршруты
    location / {
      auth_request /auth;
      error_page 401 = @auth_fail;
      auth_request_set $auth_user_id $upstream_http_x_user_id;
      auth_request_set $auth_authorities $upstream_http_x_authorities;
      auth_request_set $auth_jti $upstream_http_x_jti;

      include /etc/nginx/conf.d/proxy_headers.conf;

      proxy_set_header X-User-ID $auth_user_id;
      proxy_set_header X-Authorities $auth_authorities;
      proxy_set_header X-Jti $auth_jti;
      proxy_set_header Authorization $auth_header;

      proxy_pass http://httpservice;
    }
  }
}
