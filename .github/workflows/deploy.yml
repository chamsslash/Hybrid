name: 🚀 Deploy to Kubernetes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CLUSTER_NAME: hybrid-cluster
  NAMESPACE: hybrid-platform

jobs:
  # Проверка и тестирование
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Lint Helm charts
        run: |
          helm lint ./Helm
          helm dependency update ./Helm

      - name: 🧪 Test chart rendering
        run: |
          helm template test ./Helm --values ./Helm/values.yaml > /dev/null

  # Деплой в Kubernetes
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker images
        run: |
          # AuthService
          docker build -t ${{ secrets.DOCKER_USERNAME }}/authservice:${{ github.sha }} ./AuthService
          docker build -t ${{ secrets.DOCKER_USERNAME }}/authservice:latest ./AuthService
          docker push ${{ secrets.DOCKER_USERNAME }}/authservice:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/authservice:latest

          # HTTPService
          docker build -t ${{ secrets.DOCKER_USERNAME }}/httpservice:${{ github.sha }} ./HTTPService
          docker build -t ${{ secrets.DOCKER_USERNAME }}/httpservice:latest ./HTTPService
          docker push ${{ secrets.DOCKER_USERNAME }}/httpservice:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/httpservice:latest

          # JwtProxy
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jwtproxy:${{ github.sha }} ./JwtProxy
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jwtproxy:latest ./JwtProxy
          docker push ${{ secrets.DOCKER_USERNAME }}/jwtproxy:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/jwtproxy:latest

          # MessegerParody
          docker build -t ${{ secrets.DOCKER_USERNAME }}/messegerparody:${{ github.sha }} ./MessegerParody
          docker build -t ${{ secrets.DOCKER_USERNAME }}/messegerparody:latest ./MessegerParody
          docker push ${{ secrets.DOCKER_USERNAME }}/messegerparody:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/messegerparody:latest

          # HandleService
          docker build -t ${{ secrets.DOCKER_USERNAME }}/handleservice:${{ github.sha }} ./HandleService
          docker build -t ${{ secrets.DOCKER_USERNAME }}/handleservice:latest ./HandleService
          docker push ${{ secrets.DOCKER_USERNAME }}/handleservice:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/handleservice:latest

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: 📦 Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: 🔐 Setup kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: 🏗️ Create kind cluster
        run: |
          kind create cluster --name ${{ env.CLUSTER_NAME }} --config kind-config.yaml
          kind export kubeconfig --name ${{ env.CLUSTER_NAME }}

      - name: 📋 Wait for cluster
        run: |
          kubectl wait --for=condition=ready node --all --timeout=300s

      - name: 🔄 Update Helm dependencies
        run: |
          helm dependency update ./Helm

      - name: 🚀 Deploy to Kubernetes
        run: |
          # Создаем namespace
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Устанавливаем Helm чарт
          helm upgrade --install hybrid-platform ./Helm \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set authservice.image.repository=${{ secrets.DOCKER_USERNAME }}/authservice \
            --set authservice.image.tag=latest \
            --set httpservice.image.repository=${{ secrets.DOCKER_USERNAME }}/httpservice \
            --set httpservice.image.tag=latest \
            --set jwtproxy.image.repository=${{ secrets.DOCKER_USERNAME }}/jwtproxy \
            --set jwtproxy.image.tag=latest \
            --set messegerparody.image.repository=${{ secrets.DOCKER_USERNAME }}/messegerparody \
            --set messegerparody.image.tag=latest \
            --set handleservice.image.repository=${{ secrets.DOCKER_USERNAME }}/handleservice \
            --set handleservice.image.tag=latest

      - name: ✅ Verify deployment
        run: |
          kubectl get all -n ${{ env.NAMESPACE }}
          kubectl get pods -n ${{ env.NAMESPACE }}

      - name: 🧹 Cleanup kind cluster
        if: always()
        run: |
          kind delete cluster --name ${{ env.CLUSTER_NAME }}

  # Деплой в продакшн (опционально)
  deploy-production:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: 📦 Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: 🔐 Configure kubectl for production
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: 🚀 Deploy to production
        run: |
          # Обновляем зависимости
          helm dependency update ./Helm

          # Деплоим в продакшн
          helm upgrade --install hybrid-platform-prod ./Helm \
            --namespace hybrid-platform \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set authservice.image.repository=${{ secrets.DOCKER_USERNAME }}/authservice \
            --set authservice.image.tag=latest \
            --set httpservice.image.repository=${{ secrets.DOCKER_USERNAME }}/httpservice \
            --set httpservice.image.tag=latest \
            --set jwtproxy.image.repository=${{ secrets.DOCKER_USERNAME }}/jwtproxy \
            --set jwtproxy.image.tag=latest \
            --set messegerparody.image.repository=${{ secrets.DOCKER_USERNAME }}/messegerparody \
            --set messegerparody.image.tag=latest \
            --set handleservice.image.repository=${{ secrets.DOCKER_USERNAME }}/handleservice \
            --set handleservice.image.tag=latest

      - name: ✅ Verify production deployment
        run: |
          kubectl get all -n hybrid-platform
          kubectl get pods -n hybrid-platform
