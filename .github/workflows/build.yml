name: build-and-deploy

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  kind-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        run: |
          docker build -t authservice:latest AuthService
          docker build -t httpservice:latest HTTPService
          docker build -t messegerparody:latest MessegerParody

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: hybrid

      - name: Load images into kind
        run: |
          kind load docker-image authservice:latest --name hybrid
          kind load docker-image httpservice:latest --name hybrid
          kind load docker-image messegerparody:latest --name hybrid

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm deploy
        run: |
          helm upgrade --install hybrid ./Helm \
            --namespace hybrid-platform \
            --create-namespace \
            --set authservice.image.repository=authservice \
            --set authservice.image.tag=latest \
            --set authservice.google.clientId=local-google-client-id \
            --set authservice.google.clientSecret=local-google-client-secret \
            --set httpservice.image.repository=httpservice \
            --set httpservice.image.tag=latest \
            --set httpservice.security.refreshSecret=local-refresh-secret \
            --set messegerparody.image.repository=messegerparody \
            --set messegerparody.image.tag=latest \
            --set secrets.minioRootUser=local-minio-root \
            --set secrets.minioRootPassword=local-minio-password \
            --set secrets.minioAccessKey=local-minio-access-key \
            --set secrets.minioSecretKey=local-minio-secret-key

      - name: Wait for workloads
        run: |
          kubectl wait --namespace hybrid-platform --for=condition=Available deployment --all --timeout=300s
          kubectl get pods -n hybrid-platform -o wide
