name: build-and-deploy

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GOOGLE_CLIENT_ID       -> authservice.google.clientId       (OAuth client id)
#   GOOGLE_CLIENT_SECRET   -> secrets.googleClientSecret         (OAuth client secret)
#   REFRESH_SECRET         -> secrets.refreshSecret              (httpservice refresh token signing secret)
#   DB_PASSWORD            -> secrets.dbPassword                 (Postgres password)
#   GRAFANA_ADMIN_PASSWORD -> secrets.grafanaAdminPassword       (Grafana admin password)
#   MINIO_ROOT_USER        -> secrets.minioRootUser              (MinIO server root identity)
#   MINIO_ROOT_PASSWORD    -> secrets.minioRootPassword          (MinIO server root credential)
#   MINIO_ACCESS_KEY       -> secrets.minioAccessKey             (MinIO app S3 access key)
#   MINIO_SECRET_KEY       -> secrets.minioSecretKey             (MinIO app S3 secret key)
# If any of these are not configured, kind-deploy will render the Helm chart
# with empty credentials (CI smoke will still run, but with blank creds).

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 is required: Mockito breaks under JDK 25.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run HTTPService unit tests
        run: mvn -B -f HTTPService/pom.xml test

      - name: Run MessegerParody unit tests
        run: mvn -B -f MessegerParody/pom.xml test

  kind-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        run: |
          docker build -t authservice:latest AuthService
          docker build -t httpservice:latest HTTPService
          docker build -t messegerparody:latest MessegerParody

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: hybrid

      - name: Load images into kind
        run: |
          kind load docker-image authservice:latest --name hybrid
          kind load docker-image httpservice:latest --name hybrid
          kind load docker-image messegerparody:latest --name hybrid

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm deploy
        run: |
          helm upgrade --install hybrid ./Helm \
            --namespace hybrid-platform \
            --create-namespace \
            --set authservice.image.repository=authservice \
            --set authservice.image.tag=latest \
            --set authservice.google.clientId=${{ secrets.GOOGLE_CLIENT_ID }} \
            --set secrets.googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --set httpservice.image.repository=httpservice \
            --set httpservice.image.tag=latest \
            --set secrets.refreshSecret=${{ secrets.REFRESH_SECRET }} \
            --set messegerparody.image.repository=messegerparody \
            --set messegerparody.image.tag=latest \
            --set secrets.dbPassword=${{ secrets.DB_PASSWORD }} \
            --set secrets.grafanaAdminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --set secrets.minioRootUser=${{ secrets.MINIO_ROOT_USER }} \
            --set secrets.minioRootPassword=${{ secrets.MINIO_ROOT_PASSWORD }} \
            --set secrets.minioAccessKey=${{ secrets.MINIO_ACCESS_KEY }} \
            --set secrets.minioSecretKey=${{ secrets.MINIO_SECRET_KEY }}

      - name: Wait for MinIO provisioning job
        run: |
          kubectl wait --namespace hybrid-platform --for=condition=complete job/minio-provision --timeout=180s

      - name: Wait for workloads
        run: |
          kubectl wait --namespace hybrid-platform --for=condition=Available deployment --all --timeout=300s
          kubectl get pods -n hybrid-platform -o wide
