name: build-and-deploy

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  kind-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        run: |
          docker build -t authservice:latest -f AuthService/Dockerfile .
          docker build -t httpservice:latest -f HTTPService/Dockerfile .
          docker build -t jwtproxy:latest -f JwtProxy/Dockerfile .
          docker build -t messegerparody:latest -f MessegerParody/Dockerfile .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: hybrid

      - name: Load images into kind
        run: |
          kind load docker-image authservice:latest --name hybrid
          kind load docker-image httpservice:latest --name hybrid
          kind load docker-image jwtproxy:latest --name hybrid
          kind load docker-image messegerparody:latest --name hybrid

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm deploy
        run: |
          helm upgrade --install hybrid ./Helm \
            --namespace hybrid-platform \
            --create-namespace \
            --set authservice.image.repository=authservice \
            --set authservice.image.tag=latest \
            --set httpservice.image.repository=httpservice \
            --set httpservice.image.tag=latest \
            --set jwtproxy.image.repository=jwtproxy \
            --set jwtproxy.image.tag=latest \
            --set messegerparody.image.repository=messegerparody \
            --set messegerparody.image.tag=latest
