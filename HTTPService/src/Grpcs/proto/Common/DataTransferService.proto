syntax = "proto3";

package com.example.grpc;

message User {
  string id = 1;
  string username = 2;
  string role= 3;

}


message Message {
  int64 id = 1;
  int64 user_id = 2;
  int64 chat_id = 3;
  string text = 4;
  string timestamp = 6;
  string chat_name =  7;
  string user_name= 8;
  string image_url = 9 ;
  // Ключ стикера в MinIO: sticker/<ownerUserId>/<uuid>.<ext> (beads a22). Пусто —
  // обычное текстовое сообщение.
  //
  // НЕ путать с image_url = 9: там ключ АВАТАРКИ отправителя, а не вложение.
  //
  // Номер 10 обязан совпадать с копией этого файла у MessegerParody: копии независимы и
  // синхронизируются руками, а на проводе смысл поля задаёт номер, а не имя. Разъехались
  // номера — вторая сторона молча выбросит поле как неизвестное, и стикеры исчезнут из
  // истории чата без единой ошибки.
  string sticker_key = 10;
}

// Личный набор стикеров пользователя (beads a22): различные sticker_key, которые он
// когда-либо отправлял, по убыванию последнего использования. Отдельной таблицы под
// набор нет — это производная от истории сообщений.
message StickerListResponse {
  repeated string object_key = 1;
}

message AuthResponse {
  string status = 1;
  string message = 2;
  string role  =3;
  string  sub = 4;
}

message ChatResponse {
  string status = 1;
  string message = 2;
  int64  id = 3;
  string newestmessagepreview=  4;
  string newestmessagetimestamp=5;
  string image_url =6;

}

message UserDataRequest {
  int64 id =1;
  string username = 2 ;
  string  password =3;
  // Маркер аватара на регистрации (beads krr): "pending" — файл есть и вот-вот уедет в
  // MinIO, "" — пользователь оставил поле пустым. Симметрично ChatData.image_url, где
  // эта же задача уже решена. До появления поля AuthService безусловно писал "pending",
  // и пользователь без аватара навсегда оставался с крутящимся спиннером.
  //
  // Номер 5, а не свободный 4: в копии этого же .proto у MessegerParody поле 4 занято
  // старым `string jwt`, а UserListResponse с UserDataRequest внутри ходит от него к
  // HTTPService — совпадение номеров с разным смыслом на проводе не нужно никому.
  string image_url = 5;
}

message ListOfMessages {
  repeated Message message_list = 1;
}
message Notification{
  string  content = 1;
  string type = 2;
  string  websocket_id = 3;
}
message ChatData {
  string title =1;
  int64 chat_id = 2;
  repeated User user = 3;
  User author_id = 4;
  string image_url = 5;
}

message ListOfChats{
  repeated ChatData chatdata_list=1;
}

message UserListResponse {
  repeated UserDataRequest users = 1;
}
message RepeatedUsernames{
  repeated  string  names= 1;
}

// Запрос подсказок по началу ника. requester_id исключается из выдачи — он и так автор
// чата. limit ограничивает размер ответа; 0 и отрицательные трактуются как «ничего не
// возвращать» (см. UsernameSearchService в AuthService).
//
// Номера полей и имя rpc обязаны БУКВАЛЬНО совпадать с копией этого файла в AuthService
// (src/main/proto/DataTransferService.proto): копии разошлись исторически и
// синхронизируются поштучно. Расхождение имени уже приводило к UNIMPLEMENTED в проде
// (beads 5l4).
message UsernamePrefixRequest {
  string prefix = 1;
  int64 requester_id = 2;
  int32 limit = 3;
}

message idToken{
  string  id =1;
}
message  AccessToken{}
message AccessResponse{
  string  access =1;
  string name = 2;
  string id = 3;
}
message ImageId{
  string  id =1;
}
message DriveUrl{
  string url = 1;
}
message Sub_Role{
  string sub = 1;

  string role = 4;
}

// Смена ника (beads ehe). Ответ — существующее AuthResponse: у него уже есть пара
// status/message, и заводить второе сообщение с той же формой незачем.
// Коды status: "200" успех, "666" ник занят, "400" пустой ник, "404" пользователя нет.
//
// Номера полей и имя rpc обязаны БУКВАЛЬНО совпадать с копией этого файла в AuthService.
message ChangeUsernameRequest {
  int64 user_id = 1;
  string new_username = 2;
}

// Смена пароля (beads ehe). Требуется текущий пароль: без него любой перехваченный
// access-токен превращается в полный захват аккаунта.
// Коды status в AuthResponse: "200" успех, "401" неверный текущий пароль,
// "409" у аккаунта нет пароля (вход через Google), "400" пустой новый пароль,
// "404" пользователя нет.
//
// ВАЖНО для вызывающей стороны: "401" здесь — это код В ТЕЛЕ ответа, а не HTTP-статус.
// Отдавать его наружу как HTTP 401 нельзя: интерцептор SPA (static/axios.js) трактует
// 401 как «протух токен», делает refresh и ПОВТОРЯЕТ запрос — ошибка ввода ушла бы в
// бесконечный цикл повторов вместо экрана. Наружу это 403.
message ChangePasswordRequest {
  int64 user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

// Признак «у аккаунта есть пароль» для экрана профиля. Сам хеш наружу не отдаётся
// ни при каких условиях — только этот флаг. Аккаунты, заведённые через Google, пароля
// не имеют, и секция смены пароля им не показывается.
message ProfileFlags {
  bool has_password = 1;
}

service AuthTransferService {
  rpc getUserBySub(Sub_Role) returns (User);
  rpc GetAllUsersByChatId(com.example.grpc.ChatData) returns (com.example.grpc.UserListResponse);
  rpc get_user_by_username(RepeatedUsernames) returns (UserListResponse);
  rpc search_users_by_prefix(UsernamePrefixRequest) returns (UserListResponse);
  rpc register(UserDataRequest) returns (AuthResponse);
  rpc login(UserDataRequest) returns (AuthResponse);
  rpc CheckAuthorization(idToken) returns (AccessResponse);
  rpc CheckOneTimeCodeAndGetSub_Role(idToken) returns (Sub_Role);
  rpc change_username(ChangeUsernameRequest) returns (AuthResponse);
  rpc change_password(ChangePasswordRequest) returns (AuthResponse);
  rpc has_password(UserDataRequest) returns (ProfileFlags);
}
