<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Обновление сессии...</title>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js" th:attr="nonce=${nonce}"></script>
</head>
<body>
<p>Ждите</p>
<div id="data-container" th:data-return-url="${returnUrl}"></div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" th:attr="nonce=${nonce}"></script>
<script type="module" src="/axios.js" th:attr="nonce=${nonce}"></script>
<script type="module" th:inline="javascript" th:attr="nonce=${nonce}">
    const {getFingerprintData} = await import("/meta_catcher.js")
    const {setAccessToken} = await import("/inmemory.js")
    import api from  '/axios.js';     // Получаем URL для возврата из data-атрибута
    const container = document.getElementById("data-container");
    const returnUrl = container.dataset.returnUrl || '/dashboard'; // Указываем страницу по умолчанию

        try {
            // 1. Генерируем фингерпринтme
            const  meta = await getFingerprintData()
            const formData = new URLSearchParams();

            // 2. Делаем AJAX-запрос (fetch) на эндпоинт обмена
            console.log("Отправка запроса на /exchangeTokens с фингерпринтом...");
            formData.append('FpComponents',JSON.stringify(meta.components))

            const response = await api.post(
                '/exchangeTokens', // URL
                formData,          // Тело запроса (data)
                {                  // Конфигурация (config)
                    headers: {
                        'X-Fingerprint': meta.fingerprint,
                        "X-Client-Meta": JSON.stringify(meta.clientMeta),
                        "X-SecureUUID": meta.secureUUID,
                        // Axios автоматически установит Content-Type для URLSearchParams, но можно указать явно
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRF-TOKEN': document.cookie.split('; ').find(row => row.startsWith("XSRF-TOKEN"+ '='))?.split('=')[1]
                    }
                }
            );

            // 3. Проверяем ответ от сервера
            if (response.data?.accessToken) {
                setAccessToken(response.data.accessToken);
            }

            // 4. УСПЕХ! Куки уже выставлены сервером, просто редиректим дальше.
            // Страница вне SPA (свой Thymeleaf-документ, роутера нет), поэтому уход на returnUrl —
            // смена документа: токен из памяти теряется и добирается silent refresh'ем уже в шелле.
            console.log("Tokens refreshed");
            console.log(`Редирект на: ${returnUrl}`);
            window.location.href = returnUrl;
            // try {
            //     const resp = await api.get('/processAccess', {
            //         params: {accessToken: accessToken,}
            //     });
            //     console.log(resp.data.text)
            // }catch (e){
            //     const status = e.response?.status;
            //     const redirectUrl = e.response?.data?.redirectUrl;
            //     if (status === 400 && redirectUrl) {
            //         window.location.href = redirectUrl;
            //
            //     }
            //     console.error(e)
            // }

        } catch (error) {
            console.error("Не удалось обновить сессию:", error);
            window.location.href = '/welcome';
        }


</script>
</body>
</html>
