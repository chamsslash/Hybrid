<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEBEGRAM</title>
    <link rel="stylesheet" th:href="@{/css/style2.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <div class="chat-avatar-container" id="chat_img-header" data-user-id="header" th:attr="data-user-id=${chat_id}">
        <div th:if="${chat_image_url == 'pending'}" class="spinner-avatar"></div>

        <img th:if="${chat_image_url != 'pending' and !#strings.isEmpty(chat_image_url)}"
             th:src="'https://drive.google.com/thumbnail?id=' + ${chat_image_url} + '&sz=w1000'"
             alt="chat avatar" class="chat-avatar" />

        <img th:if="${chat_image_url != 'pending' and #strings.isEmpty(chat_image_url)}"
             src="/images/rofl-cat.jpg"
             alt="chat avatar" class="chat-avatar" />
        </div>
        <span th:text="${title}"></span>
        <div id="typing-indicator"></div>
        <button onclick="window.location.href = '/placeholder';" style="margin-left: 10px;">Placeholder</button>

    </div>

    <div id="context" th:data-username="${username}" th:data-userimage="${image_url}" th:data-chat-id="${chat_id}" th:data-user-id="${user_id}"></div>

    <div class="chat-messages" id="chatMessages">
        <th:block th:if="${messages instanceof T(java.util.List)}">
            <div th:each="msg : ${messages}"
                 th:class="'message ' + (${msg.user_id} == ${user_id} ? 'user' : 'bot')">

                <div class="message-avatar"
                     th:id="'img-' + ${msg.chat_id}"
                     th:attr="data-user-id=${msg.user_id}">

                    <div th:if="${msg.image_url == 'pending'}" class="spinner-avatar"></div>

                    <img th:if="${msg.image_url != 'pending' and !#strings.isEmpty(msg.image_url)}"
                         th:src="'https://drive.google.com/thumbnail?id=' + ${msg.image_url} + '&sz=w1000'"
                         alt="chat avatar" class="chat-avatar" />

                    <img th:if="${msg.image_url != 'pending' and #strings.isEmpty(msg.image_url)}"
                         src="/images/rofl-cat.jpg"
                         alt="chat avatar" class="chat-avatar" />
                </div>

                <div class="message-content">
                    <div>
                        <strong th:text="${msg.username}">Имя</strong>
                        <span style="float: right; font-size: 12px; color: #999;"
                              th:text="${msg.timestamp}">время</span>
                    </div>
                    <div>
                        <span th:text="${msg.text}">Текст сообщения</span>
                    </div>
                </div>
            </div>
        </th:block>


        <th:block th:unless="${messages instanceof T(java.util.List)}">
            <div class="message error-message">
                <span th:text="${messages}"></span>
            </div>
        </th:block>
    </div>

    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Type your message...">


        <button onclick="sendChatMessage()">Send</button>
        <button type="button" onclick="requestAIResponse()">Помощь AI</button>
    </div>
    <select id="aiUserSelect">
        <option value="">Выберите пользователя для AI-ответа</option>
        <option th:each="user : ${usernames}"
                th:if="${user != username}"
                th:value="${user}"
                th:text="${user}"></option>
    </select>
</div>

<div id="toastContainer" class="toast-container"></div>
<div id="global-spinner" class="global-spinner-overlay" style="display: none;">
    <div class="big-spinner"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js" th:attr="nonce=${nonce}"></script>
<script  src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"  th:attr="nonce=${nonce}"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js" th:attr="nonce=${nonce}"></script>
<script src="../static/trusted_policy.js" th:attr="nonce=${nonce}"></script>


<script src="../static/index.js"></script>


</body>
</html>
