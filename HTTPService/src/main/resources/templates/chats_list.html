<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список чатов</title>
    <link rel="stylesheet" th:href="${pathPrefix + '/css/style2.css'}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
</head>
<body>

<div id="context" th:data-user-id="${user_id}"></div>

<div class="post-feed">
    <h2 style="text-align: center;">Ваши чаты</h2>
    <div th:if="${chats == null or chats.isEmpty()}">
        <p  id="no-chats-message" style="text-align: center; color: #888;">У вас пока нет чатов</p>
    </div>
        <div class="chat-messages" id="chats">
            <div th:each="chat : ${chats}"
                 class="post"
                 th:data-chat-id="${chat.id}"
                 th:data-chat-title="${chat.title}"
                 onclick="window.location.href='/chat?id=' + this.dataset.chatId + '&title=' + this.dataset.chatTitle"
                 style="cursor: pointer;">

                <div class="post-header" th:attr="data-chat-id=${chat.id}">
                    <div class="message-avatar"
                         th:id="'chat-img-' + ${chat.id}"
                         th:attr="data-chat-id=${chat.id}">

                        <div th:if="${chat.chat_image_url == 'pending'}" class="spinner-avatar"></div>

                        <div th:if="${chat.chat_image_url != null and chat.chat_image_url != 'pending' and !#strings.isEmpty(chat.chat_image_url)}"
                             class="chat-avatar-container">
                            <img th:src="'https://drive.google.com/thumbnail?id=' + ${chat.chat_image_url} + '&sz=w100'"
                                 alt="chat avatar" class="chat-avatar">
                        </div>

                        <img th:if="${(chat.chat_image_url == null or #strings.isEmpty(chat.chat_image_url)) and chat.chat_image_url != 'pending'}"
                             src="/images/rofl-cat.jpg"
                             alt="chat avatar" class="chat-avatar"/>
                    </div>


                    <div class="user-info">
                        <span class="chat-title" th:text="${chat.title}">Название чата</span>
                    </div>

                    <span class="post-time" th:id="'timestamp-' + ${chat.id}"
                          th:text="${chat.lastMessageTime != null and !#strings.isEmpty(chat.lastMessageTime) ? chat.lastMessageTime : ''}">
                        время
                    </span>
                </div>

                <div class="post-content">
                    <div class="message-preview">
                        <th:block th:if="${chat != null and chat.preview != null and !#strings.isEmpty(chat.preview)}">
                            <th:block th:if="${chat.preview_username != null and !#strings.isEmpty(chat.preview_username)}">
                                <span class="user-id" th:id="'username-' + ${chat.id}"
                                      th:text="${chat.preview_username + ' : '}">Username:</span>
                            </th:block>
                            <p th:id="'preview-' + ${chat.id}" th:text="${chat.preview}">Предпросмотр последнего сообщения</p>
                        </th:block>

                        <th:block th:unless="${chat != null and chat.preview != null and !#strings.isEmpty(chat.preview)}">
                            <p class="no-message" th:id="'preview-' + ${chat.id}">Нет сообщений</p>
                        </th:block>
                    </div>
                </div>

            </div>
        </div>
</div>


<div id="toastContainer" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js" th:attr="nonce=${nonce}"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js" th:attr="nonce=${nonce}"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js" th:attr="nonce=${nonce}"></script>
<script src="/trusted_policy.js" th:attr="nonce=${nonce}"></script>
<script src="/chatlist.js" th:attr="nonce=${nonce}"></script>

<script>

</script>

</body>
</html>
