<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget=resizes-content: без него экранная клавиатура на Android
         уменьшает ТОЛЬКО visual viewport, а layout viewport (и dvh, и position: fixed)
         остаётся прежним — композер вместе с нижней полосой рельса оказывается под
         клавиатурой, и доскроллить до них нечем: у чата высота ровно во вьюпорт, у
         документа нет запаса прокрутки. С resizes-content клавиатура ужимает layout
         viewport, dvh пересчитывается, и строка ввода встаёт над ней. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>TEBEGRAM</title>
    <!-- tokens.css ОБЯЗАН идти первым: остальные файлы написаны через var(...),
         и если палитра приедет второй, переменные разрешатся в пустоту. -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/shell.css">
    <link rel="stylesheet" href="/css/style2.css">
    <link rel="stylesheet" href="/css/style_welcome.css">
</head>
<body class="shell-off">
<div id="shell">
    <!--
        Рельс живёт в шаблоне, а не рисуется из JS, по двум причинам. Первая:
        роутер на каждом переходе делает replaceChildren() над #app, и всё, что
        нарисовано внутри, умирает — рельс обязан быть СНАРУЖИ. Вторая: статическая
        разметка не проходит через DOMPurify, поэтому под Trusted Types здесь нечему
        ломаться; из JS пишется только карточка пользователя (#rail-user).
    -->
    <aside id="rail">
        <div class="rail-brand">
            <span class="rail-logo" aria-hidden="true"></span>
            <span class="rail-wordmark">TEBEGRAM</span>
        </div>

        <nav class="rail-nav" aria-label="Основная навигация">
            <button type="button" class="rail-item" data-route="/reactive/chatlist">
                <span class="rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
                    </svg>
                </span>
                <span class="rail-label">Чаты</span>
            </button>
            <button type="button" class="rail-item" data-route="/reactive/profile">
                <span class="rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="3.6"/>
                        <path d="M4.6 20a7.4 7.4 0 0 1 14.8 0"/>
                    </svg>
                </span>
                <span class="rail-label">Профиль</span>
            </button>
        </nav>

        <div id="rail-user" class="rail-user"></div>
    </aside>

    <main id="app"></main>
</div>
<div id="toastContainer" class="toast-container"></div>
<div id="global-spinner" class="global-spinner-overlay" style="display: none;">
    <div class="big-spinner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js" th:attr="nonce=${nonce}"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js" th:attr="nonce=${nonce}"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js" th:attr="nonce=${nonce}"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js" th:attr="nonce=${nonce}"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js" th:attr="nonce=${nonce}"></script>
<script src="/trusted_policy.js" th:attr="nonce=${nonce}"></script>
<script type="module" src="/app.js" th:attr="nonce=${nonce}"></script>
</body>
</html>
