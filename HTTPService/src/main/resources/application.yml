# РЕШЕНИЕ ПРОБЛЕМЫ №2: Правильный синтаксис для application.yml

debug: true
securityProps:
  refresh-secret: CHANGE_ME
  refresh-expiration-ms: 604800000
  jwt-expiration-ms: 900000
  thymeleaf:
    enabled: true
    suffix: .html
  webflux:
    base-path: /reactive
spring:

  data:
    redis:
      url: redis://redis:6379/0
  webflux:
    log-request-details: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  main:
    allow-bean-definition-overriding: true
    log-bean-definition-overriding: true
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      properties:
        max.request.size: 10485760



    consumer:
      group-id: hybrid_group
      auto-offset-reset: earliest
      enable-auto-commit: true


grpc:
  client:
    MessageTransferService:
      address: "dns:///messegerparody:9091"
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      default-load-balancing-policy: round_robin


    ChatService:
      address: "dns:///messegerparody:9091"
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      default-load-balancing-policy: round_robin


    AuthTransferService:
      address: "dns:///authservice:9092"
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      default-load-balancing-policy: round_robin

    ReactiveTransferService:
      address: "dns:///messegerparody:9091"
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      default-load-balancing-policy: round_robin


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web.servlet: DEBUG
    org.springframework.web.method: DEBUG
    org.springframework.web.reactive: TRACE
    org.springframework.web.reactive.function.server.DefaultRouterFunction: DEBUG
    org.springframework.web.server.adapter: DEBUG
    org.springframework.http.server.reactive.ServletHttpHandlerAdapter: DEBUG
    com.example.springexample: DEBUG
    reactor.netty: DEBUG



  codec:
    log-request-details: true
