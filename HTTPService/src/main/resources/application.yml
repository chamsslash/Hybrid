securityProps:
  refresh-secret: ${REFRESH_SECRET}
  refresh-expiration-ms: 604800000
  jwt-expiration-ms: 900000
  thymeleaf:
    enabled: true
    suffix: .html
  webflux:
    base-path: /reactive
spring:

  data:
    redis:
      url: redis://redis:6379/0
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  main:
    allow-bean-definition-overriding: true
    log-bean-definition-overriding: true
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      properties:
        max.request.size: 10485760



    consumer:
      group-id: hybrid_group
      auto-offset-reset: earliest
      enable-auto-commit: true


grpc:
  client:
    ChatService:
      address: "dns:///messegerparody:9091"
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      default-load-balancing-policy: round_robin


    AuthTransferService:
      address: "dns:///authservice:9092"
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      default-load-balancing-policy: round_robin

    ReactiveTransferService:
      address: "dns:///messegerparody:9091"
      negotiationType: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s
      default-load-balancing-policy: round_robin


server:
  port: 8080

management:
  server:
    # Отдельный порт от 8080 (beads c2k). Ingress содержит правило
    # `path: / (Prefix) -> httpservice:8080`, то есть ВЕСЬ 8080 публичен, и
    # /actuator/prometheus отдавался наружу без аутентификации: curl на
    # http://myapp.localtest.me/actuator/prometheus возвращал 200 с полным дампом —
    # имена всех URI приложения, версия JVM, имена Kafka-топиков, бизнес-счётчики,
    # uptime. Это был вынужденный костыль, потому что readinessProbe висела на этом
    # эндпоинте: /actuator/health закрыт Security и отвечает 302.
    # 8090 в ingress не смотрит и в Service не публикуется, поэтому исключения в
    # Security больше не нужны — они удалены из MvcSecurityConfig и обоих фильтров.
    port: 8090
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true
    health:
      # Даёт /actuator/health/readiness, на который переехала readinessProbe.
      # В отличие от пробы на /actuator/prometheus она означает «Spring поднял
      # контекст и готов», а не «процесс отвечает по HTTP».
      probes:
        enabled: true
  metrics:
    distribution:
      # http.server.requests по умолчанию публикуется как summary, а
      # histogram_quantile() работает ТОЛЬКО по бакетам: p95 по HTTP был
      # недоступен в принципе, оставались лишь средняя и _max.
      percentiles-histogram:
        "[http.server.requests]": true
      # Границы явные, и это не косметика: дефолтные бакеты покрывают диапазон от
      # микросекунд до минут, и каждый — отдельный ряд на КАЖДОЕ значение uri.
      minimum-expected-value:
        "[http.server.requests]": 10ms
      maximum-expected-value:
        "[http.server.requests]": 10s

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.servlet: INFO
    org.springframework.web.method: INFO
    org.springframework.web.reactive: INFO
    org.springframework.web.reactive.function.server.DefaultRouterFunction: INFO
    org.springframework.web.server.adapter: INFO
    org.springframework.http.server.reactive.ServletHttpHandlerAdapter: INFO
    com.example.springexample: INFO
    reactor.netty: INFO
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR

