syntax = "proto3";

package com.example.grpc;

option java_package = "com.example.grpc";
option java_outer_classname = "DataTransferService";

message User {
  string id = 1;
  string username = 2;

}

message Message {
  int64 id = 1;
  int64 user_id = 2;
  int64 chat_id = 3;
  string text = 4;
  string timestamp = 6;
  string chat_name =  7;
  string user_name= 8;
  string image_url = 9 ;
  // Ключ стикера в MinIO: sticker/<ownerUserId>/<uuid>.<ext> (beads a22). Пусто —
  // обычное текстовое сообщение.
  //
  // НЕ путать с image_url = 9: там ключ АВАТАРКИ отправителя, а не вложение.
  //
  // Номер 10 обязан совпадать с копией этого файла у HTTPService: копии независимы и
  // синхронизируются руками, а на проводе смысл поля задаёт номер, а не имя. Разъехались
  // номера — вторая сторона молча выбросит поле как неизвестное, и стикеры исчезнут из
  // истории чата без единой ошибки.
  string sticker_key = 10;
}

// Личный набор стикеров пользователя (beads a22): различные sticker_key, которые он
// когда-либо отправлял, по убыванию последнего использования. Отдельной таблицы под
// набор нет — это производная от истории сообщений.
message StickerListResponse {
  repeated string object_key = 1;
}

message AuthResponse {
  string status = 1;
  string message = 2;
  string auth_token = 3;
}
message ChatResponse {
  string status = 1;
  string message = 2;
  int64  id = 3;
  string newestmessagepreview=  4;
  string newestmessagetimestamp=5;
  string image_url =6;

}

message UserDataRequest {
  int64 id =1;
  string username = 2;
  string password = 3;
  string jwt = 4;
  // Ключ аватарки. Появился здесь позже, чем в копиях AuthService и HTTPService, потому
  // что до экрана состава чата MessegerParody его никуда не отдавал.
  //
  // Номер 5 обязателен и совпадает с обеими другими копиями: UserListResponse с этим
  // сообщением внутри уезжает отсюда в HTTPService, а на проводе смысл поля задаёт
  // номер, а не имя. Взять свободный номер «поаккуратнее» значило бы, что HTTPService
  // прочитает аватарку как неизвестное поле и молча выбросит.
  //
  // Поле 4 (jwt) — застарелое расхождение этой копии: в двух других его нет. Не трогаю:
  // его никто не заполняет, а перенумерация — отдельная задача со своим риском.
  string image_url = 5;
}

message ListOfMessages {
  repeated Message message_list = 1;
}
message UserListResponse {
  repeated UserDataRequest users = 1;
}
message ChatData {
  string title =1;
  int64 chat_id = 2;
  repeated User user = 3;
  User author_id = 4;
  string image_url = 5;
}
message ListOfChats{
  repeated ChatData chatdata_list=1;
}
//service ChatService {
  //rpc getnewest(ChatData) returns (Message);
 // rpc transferchat(ChatData) returns (ChatResponse);
 // rpc getallchatsbyid(ChatData) returns (ListOfChats); // We send only 1 user in repeated user, but get all chats
 // rpc getimageurl(ChatData) returns(DriveUrl) ;///Chat data only with id(CHAT)
//}

message DriveUrl{
  string url = 1;
  string  chat_id =2;
  string  type = 3;
}
service AuthTransferService {
  rpc register(UserDataRequest) returns (AuthResponse);
  rpc login(UserDataRequest) returns (AuthResponse);
  rpc Jwt_check(UserDataRequest) returns (AuthResponse);
}
