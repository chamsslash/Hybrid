server:
  port: 8082

grpc:
  server:
    port: 9091

management:
  # Отдельный management-порт НЕ нужен, в отличие от HTTPService и AuthService:
  # бизнес-HTTP у сервиса нет вовсе (наружу он говорит по gRPC 9091 и через
  # Kafka), в ingress он не смотрит, поэтому весь 8082 — служебный порт, и
  # разделять на нём нечего. До beads c2k на 8082 вообще никто не слушал.
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Таймер gRPC от net.devh публикуется как summary, а histogram_quantile()
      # работает ТОЛЬКО по бакетам — без этого латентность хопа между сервисами
      # доступна лишь средней. http.server.requests здесь не настраиваем: у сервиса
      # нет бизнес-HTTP, весь трафик на 8082 — это скрейпы Prometheus.
      # Кардинальность мала: теги service/method/statusCode на десяток методов,
      # а не на открытый набор URI.
      percentiles-histogram:
        "[grpc.server.processing.duration]": true
      minimum-expected-value:
        "[grpc.server.processing.duration]": 1ms
      maximum-expected-value:
        "[grpc.server.processing.duration]": 5s

spring:
  kafka:
    bootstrap-servers: kafka:9092
    admin:
      # Геометрией топиков владеет Helm (kafka.createTopics/partitionsPerTopic), не сервис
      # (beads lo2). @RetryableTopic с autoCreateTopics по умолчанию объявляет NewTopic не
      # только на retry/DLT, но и на ГЛАВНЫЕ топики — с одной партицией. Если такой
      # KafkaAdmin успевал создать "Messages" раньше джобы kafka-topics, консьюмер
      # стартовал на однопартиционном топике и держал только партицию 0 до истечения
      # metadata.max.age.ms (~5 минут), а сообщения с партиций 1..4 всё это время не
      # доезжали до БД. auto-create: false выключает создание топиков этим сервисом
      # целиком: топики создаёт джоба, а retry/DLT-топики (их имена выводятся из
      # attempts/backoff в KafkaConsumer, в чарте их не перечислить) по-прежнему
      # появляются на лету — через auto.create.topics.enable брокера, у которого
      # num.partitions приравнен к partitionsPerTopic. Выключать авто-создание на брокере
      # нельзя, не сломав этим DLT-путь.
      auto-create: false
    producer:
      properties:
        max.request.size: 10485760
    consumer:
      group-id: messegerparody-consumer
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:hybrid_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:hybrid_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
    pool:
      # Дефолт r2dbc-pool на acquire — без таймаута: при исчерпанном пуле .block()
      # в KafkaConsumer мог бы висеть вечно и уронить консьюмера с ребалансом.
      max-acquire-time: 10s

  jpa:
    hibernate:
      # Liquibase — единственный владелец схемы (Hybrid-kubernetes-non-local-fwt).
      # validate, а не none: none просто отнимает право на запись, а validate
      # вдобавок валит под на старте при расхождении сущности со схемой —
      # то есть ловит дрейф сразу, а не через недели тихой поломки.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.beans.factory: DEBUG
    org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator: DEBUG
    org.hibernate: DEBUG
