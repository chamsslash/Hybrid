debug: true

server:
  port: 8082

grpc:
  server:
    port: 9091

spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      properties:
        max.request.size: 10485760

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:hybrid_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:hybrid_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.beans.factory: DEBUG
    org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator: DEBUG
    org.hibernate: DEBUG
