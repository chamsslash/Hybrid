databaseChangeLog:
  # Картинки-стикеры (Hybrid-kubernetes-non-local-a22).
  #
  # Стикер — обычное сообщение, у которого вместо текста ключ объекта в MinIO
  # (sticker/<ownerUserId>/<uuid>.<ext>). Отдельной таблицы под «набор стикеров» нет
  # намеренно: набор — это производная от истории («различные sticker_key, отправленные
  # мной, по убыванию последнего использования»), и вторая таблица стала бы вторым
  # источником правды, который обязан совпадать с message. Первый же ретрай Kafka развёл
  # бы их.
  #
  # Колонка nullable, и text тоже остаётся nullable: у стикера текста нет, у обычного
  # сообщения нет стикера. Запрет «ни того, ни другого» живёт на отправке
  # (ChatBoxStompController), а не в схеме: история уже содержит легаси-строки с NULL в
  # обоих полях, и CHECK-ограничение упало бы на существующих данных.
  #
  # VARCHAR(512), а не TEXT: это ключ, который строит только сервер по известному шаблону
  # (три сегмента, UUID в имени), и его длина ограничена сверху конструкцией. Верхняя
  # граница тут — дешёвая страховка от мусора, а не экономия.
  - changeSet:
      id: v4-001-message-add-sticker-key
      author: claude
      changes:
        - addColumn:
            tableName: message
            columns:
              - column:
                  name: sticker_key
                  type: VARCHAR(512)
      rollback:
        - dropColumn:
            tableName: message
            columnName: sticker_key
