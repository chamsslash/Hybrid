databaseChangeLog:
  # Регистронезависимая уникальность ника + индекс под поиск по префиксу.
  #
  # Три элемента, каждый обязателен, и каждый проверен экспериментом на живой базе
  # (в транзакции с откатом):
  #
  #   lower(name)       — функциональный индекс, даёт регистронезависимость. Запрос обязан
  #                       использовать РОВНО ТО ЖЕ выражение: WHERE lower(name) LIKE :prefix.
  #                       Проверено: WHERE name ILIKE :prefix даёт Seq Scan — индекс есть, но
  #                       не применяется, и на глаз это никак не видно.
  #   text_pattern_ops  — побайтовый порядок внутри индекса. Коллация БД en_US.utf8 сортирует
  #                       по словарным правилам (регистр вперемешку, дефис игнорируется на
  #                       первом уровне), из-за чего совпадения LIKE 'ab%' не образуют
  #                       непрерывного диапазона. Проверено: тот же индекс без класса
  #                       операторов даёт Seq Scan.
  #   UNIQUE            — закрывает гонку check-then-insert при регистрации и переименовании:
  #                       проверка и вставка становятся одной операцией. Проверено: вставка
  #                       'МИША' при существующей 'Миша' отбивается с
  #                       duplicate key ... Key (lower(name::text))=(миша).
  #
  # Правильный план запроса выглядит так:
  #   Bitmap Index Scan on ux_users_lower_name
  #     Index Cond: (lower(name) ~>=~ 'миш' AND lower(name) ~<~ 'мищ')
  # Если в плане Seq Scan — потерян один из трёх элементов.
  #
  # name остаётся nullable: Postgres допускает произвольное число NULL в уникальном индексе,
  # поэтому пользователи без ника друг другу не мешают.
  #
  # CONCURRENTLY не используется: он не работает внутри транзакции и потребовал бы отдельной
  # пометки Liquibase ради несуществующей на текущем объёме проблемы.
  - changeSet:
      id: v3-001-users-unique-lower-name
      author: claude
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >-
              CREATE UNIQUE INDEX ux_users_lower_name
              ON users (lower(name) text_pattern_ops)
      rollback:
        - dropIndex:
            indexName: ux_users_lower_name
            tableName: users
